    <script>
      // Early theme paint before React — match animaku-settings localStorage
      try {
        var raw =
          localStorage.getItem('animaku-settings') ||
          localStorage.getItem('aniku-settings')
        var theme = 'light'
        if (raw) {
          var parsed = JSON.parse(raw)
          if (parsed && (parsed.state?.theme === 'dark' || parsed.theme === 'dark')) {
            theme = 'dark'
          } else if (parsed && (parsed.state?.theme === 'light' || parsed.theme === 'light')) {
            theme = 'light'
          }
        }
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
